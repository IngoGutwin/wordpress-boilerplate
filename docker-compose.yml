services:

  am_mariadb:
    env_file: ./.env
    image: mariadb:10.5
    container_name: am_mariadb
    restart: unless-stopped 
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD} 
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - am_mariadb:/var/lib/mysql
    ports:
      - "3306:3306"

  am_apache2:
    env_file: ./.env
    build:
      context: .
      dockerfile: ./docker/Dockerfile.apache2php8.3
    image: apache2-wordpress:1.0
    container_name: container_am_apache2
    restart: unless-stopped
    depends_on: 
      - am_mariadb 
    volumes:
      - ./wp:/var/www/html
      - ./docker/apache2.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      WP_SITEURL: ${WP_SITEURL}
      WP_CACHE: ${WP_CACHE}
      WP_DEBUG: ${WP_DEBUG}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY}
      DISALLOW_FILE_MODS: ${DISALLOW_FILE_MODS}
      WP_AUTO_UPDATE_CORE: ${WP_AUTO_UPDATE_CORE}
      AUTH_KEY: ${AUTH_KEY}
      SECURE_AUTH_KEY: ${SECURE_AUTH_KEY}
      LOGGED_IN_KEY: ${LOGGED_IN_KEY}
      NONCE_KEY: ${NONCE_KEY}
      AUTH_SALT: ${AUTH_SALT}
      SECURE_AUTH_SALT: ${SECURE_AUTH_SALT}
      LOGGED_IN_SALT: ${LOGGED_IN_SALT}
      NONCE_SALT: ${NONCE_SALT}
      WORDPRESS_DB_HOST: ${DATABASE_HOST}
      WORDPRESS_DB_USER: ${DATABASE_USER}
      WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD}
      WORDPRESS_DB_NAME: ${DATABASE_NAME}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
    ports:
      - "80:80"
      
volumes:
  am_mariadb:
